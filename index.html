<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140"><g fill="none" stroke="%23A38B7A"><path d="M74 40 A34 34 0 1 0 74 100" stroke-width="8" transform="rotate(-12 50 70)"/><line x1="50" y1="10" x2="50" y2="130" stroke-width="7"/><line x1="34" y1="11" x2="66" y2="11" stroke-width="6" stroke-linecap="round"/><line x1="34" y1="129" x2="66" y2="129" stroke-width="6" stroke-linecap="round"/></g></svg>' />
    <title>City Ink — Front of House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Montserrat is the brand body face. Archivo stands in for Monument
         Extended (paid licence) until those files are added. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a saved dark theme doesn't flash white
      // while React boots. Mirrors the logic in lib/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("cityink-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          if (theme === "dark") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0A0810");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body class="bg-background font-sans text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
