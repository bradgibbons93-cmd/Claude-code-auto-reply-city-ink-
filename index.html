<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" fill="%23C6A47D"><path d="M70 42 A30 34 0 1 0 70 88 L70 79 A22 26 0 1 1 70 51 Z"/><rect x="45.5" y="18" width="6" height="94"/><rect x="34" y="18" width="29" height="5.5"/><rect x="34" y="106.5" width="29" height="5.5"/></svg>' />
    <title>City Ink — Front of House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bodoni Moda for the wordmark (the sheet's Didone), Montserrat for
         everything else — the brand body face. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a saved dark theme doesn't flash white
      // while React boots. Mirrors the logic in lib/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("cityink-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          if (theme === "dark") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0A0810");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body class="bg-background font-sans text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
